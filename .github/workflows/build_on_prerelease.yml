name: build_on_prerelease
on: 
  release:
    types: [prereleased]

jobs:
  build:
    name: Build a pre-release of the blog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Get the repo
      - name: "[Prepare] Checkout repository"
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      # Get hugo
      - name: "[Prepare] Setup Hugo"
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.168.0'
          extended: true

      # Hugo compiles the theme styles with Dart Sass, which must be on the PATH (same install as the Hugo docs)
      - name: "[Prepare] Setup Dart Sass"
        env:
          DART_SASS_VERSION: 1.105.1
        run: |
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          mkdir -p "${HOME}/.local"
          tar -C "${HOME}/.local" -xf "${{ runner.temp }}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"
        shell: bash
          
      - name: "[Build] Build the site"
        run: |
          chmod +x ./build.sh
          ./build.sh --environment staging
        shell: bash

      - name: "[Deploy] Connect and deploy to staging"
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete
          path: ./public/
          remote_path: ${{ secrets.DST_FOLDER_STAGING }} 
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: "[Deploy] Connect and deploy caddyfiles"
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete
          path: ./Caddyfile
          remote_path: ${{ secrets.DST_FOLDER_CADDY }} 
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          
      - name: "[Deploy] Cleanup"
        run: rm -rf ~/.ssh