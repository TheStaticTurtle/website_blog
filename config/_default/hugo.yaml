#########################  Website  ###########################
baseURL: 'https://blog.thestaticturtle.fr/'
refLinksNotFoundURL: "/404.html"

timeout: 15000 # Per page render, so it also bounds the opengraph fetches of a page

enableGitInfo: true

##########################  Blog  #############################

theme: turtlejs
title: TheStaticTurtle
copyright: Copyright 2026 - TheStaticTurtle

defaultContentLanguage: en
languages:
  en:
    locale: en-GB
    direction: ltr
    label: English
    weight: 1
  fr:
    locale: fr-FR
    direction: ltr
    label: Français
    weight: 2

timeZone: "Europe/Paris"

ignoreErrors: 
  - "error-remote-getjson"

#########################  Render  ###########################

markup:
  highlight:
    guessSyntax: false
    lineNos: true
    lineNumbersInTable: false
    noClasses: false
    style: manni
    tabWidth: 4
  tableOfContents:
    startLevel: 2
    endLevel: 6
    ordered: false
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      linkifyProtocol: https
      strikethrough: true
      table: true
      taskList: true
      typographer: false
    parser:
      attribute:
        block: true
        title: true
      autoHeadingID: true
      autoHeadingIDType: github
      wrapStandAloneImageWithinParagraph: false
    renderer:
      hardWraps: false
      xhtml: false
      unsafe: true

frontmatter:
  date:
    - date
    - publishDate
    - lastmod
  publishDate:
    - publishDate
    - date
  expiryDate:
    - expiryDate
  lastmod:
    - :git
    - lastmod
    - :fileModTime
    - date
    - publishDate

security:
  enableInlineShortcodes: true
  http:
    methods:
    - (?i)GET
    - (?i)POST
    urls:
    - .*

imaging:
  exif:
    disableDate: true
    disableLatLong: true

#########################  Content  ###########################

taxonomies:
  author: authors
  tag: tags

permalinks:
  posts: '/:slug/'

outputs:
  home:
    - "HTML"
    - "RSS"
  page:
    - "HTML"
  section:
    - "HTML"
  taxonomy:
    - "HTML"
  term:
    - "HTML"

enableRobotsTXT: true

sitemap:
  changefreq: always
  filename: sitemap.xml
  priority: 0.5
